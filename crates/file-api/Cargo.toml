[package]
name = "file-api"
version = "0.1.0"
edition = "2021"
description = "Axum HTTP API over file-core: authenticated, asynchronous file jobs"

[lib]
name = "file_api"

[[bin]]
name = "file-api"
path = "src/main.rs"

[dependencies]
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
tower-http = { version = "0.6", default-features = false, features = ["cors", "fs", "set-header"] }
file-core = { path = "../file-core" }
axum = { version = "0.8", features = ["multipart"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "net", "time", "sync", "signal", "io-util"] }
tokio-util = { version = "0.7", features = ["io"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
# Asks Cloudflare whether a CAPTCHA answer is genuine (only when CAPTCHA is switched on). Pure-Rust TLS.
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "stream", "rustls-tls"] }
subtle = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }

[dev-dependencies]
tokio-stream = "0.1"
tempfile = "3"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
zip = { version = "2", default-features = false, features = ["deflate"] }

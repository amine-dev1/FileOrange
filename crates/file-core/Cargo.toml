[package]
name = "file-core"
version = "0.1.0"
edition = "2021"
description = "Engine registry, ZIP and image engines, and the job framework. No HTTP, no Tauri."
build = "build.rs"

[[bin]]
name = "of-pdf-worker"
path = "src/bin/of-pdf-worker.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
thiserror = "2"
tempfile = "3"
uuid = { version = "1", features = ["v4", "serde"] }
zip = { version = "2", default-features = false, features = ["deflate", "aes-crypto", "time"] }
time = { version = "0.3", default-features = false, features = ["std"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
walkdir = "2"
webp = { version = "0.3", default-features = false }
libwebp-sys = "0.9"
serde_json = "1"
# Reads and rewrites PDFs for Compress PDF (the pictures inside them). MIT.
lopdf = { version = "0.46", default-features = false }
# PDFium is loaded from a DLL at run time, only inside the worker process.
pdfium-render = { version = "0.9", default-features = false, features = ["pdfium_latest", "image_025"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }

[dev-dependencies]

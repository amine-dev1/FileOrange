# Fly.io settings for the hosted OrangeFile. See DEPLOY.md.
# Change `app` to a name nobody else has taken: it becomes <app>.fly.dev.
app = "fileorange-amine"
primary_region = "cdg"   # Paris. "fra" (Frankfurt) or "ams" (Amsterdam) also work for visitors in Europe.

[build]
  dockerfile = "Dockerfile"

[env]
  # Must list every public name the site answers to (comma-separated), including your own domain later.
  FILE_API_ALLOWED_HOSTS = "fileorange-amine.fly.dev"
  # The Netlify site that calls this server (exact address, no trailing slash). Add your own domain here too, comma-separated.
  FILE_API_ALLOWED_ORIGINS = "https://orangefile.netlify.app"
  FILE_API_MAX_FILE_MB = "300"
  # Secrets are not set here: `fly secrets set FILE_API_SESSION_SECRET=...` (see DEPLOY.md).

[http_service]
  internal_port = 8080
  force_https = true
  # One machine that stays on: visitors' sessions, quotas and finished jobs live in its memory and disk.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    soft_limit = 40
    hard_limit = 80

  [[http_service.checks]]
    method = "GET"
    path = "/health"
    interval = "15s"
    timeout = "3s"
    grace_period = "20s"

[[vm]]
  # LibreOffice and PDFium are hungry. 2 GB is the practical minimum for Office files; 1 GB works for images and PDFs only.
  memory = "2gb"
  cpu_kind = "shared"
  cpus = 2

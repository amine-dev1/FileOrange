# Phase 0 probe for the OrangeFile Global Drag Action Wheel. NOT part of the product build:
# it has its own workspace and is built and run on its own (see PHASE0.md).
[package]
name = "dragwheel-probe"
version = "0.0.1"
edition = "2021"
description = "Windows feasibility probe: tray + global shortcut + no-activate overlay that receives an in-progress Explorer drag"

[workspace]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60", features = ["Win32_UI_Input_KeyboardAndMouse", "Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi"] }
